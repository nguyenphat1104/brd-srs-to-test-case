# Streamlit only supports single-segment page paths. A same-origin frame keeps
# the public run URL stable while its supported query API selects the saved run.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ "^/run/([A-Za-z0-9][A-Za-z0-9_-]{0,159})/?$" {
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "frame-ancestors 'self'; frame-src 'self'; default-src 'none'; style-src 'unsafe-inline'";
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run details · BRD/SRS Test Case</title><style>html,body{margin:0;height:100%;background:#f8fafc}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe title="Run details" src="/?run=$1"></iframe></body></html>';
    }

    location /run/ {
        default_type text/html;
        return 404 '<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run not found</title></head><body><h1>Invalid run link</h1><p>Choose a saved run from the run list.</p><a href="/">Back to runs</a></body></html>';
    }

    location / {
        set $streamlit app:8501;
        proxy_pass http://$streamlit;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
