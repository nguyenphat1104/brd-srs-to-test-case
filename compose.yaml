services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://brd_srs:brd_srs_local@db:5432/brd_srs
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://host.docker.internal:8081/v1}
    ports:
      - 127.0.0.1:8501:8501
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: brd_srs
      POSTGRES_USER: brd_srs
      POSTGRES_PASSWORD: brd_srs_local
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brd_srs -d brd_srs"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
